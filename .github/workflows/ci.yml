name: build-and-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Версия образа зафиксирована намеренно: с latest сборка однажды
        # сломается сама по себе, без единой правки в коде.
        image: postgres:17
        env:
          POSTGRES_DB: tuition_billing_tests
          POSTGRES_USER: billing
          POSTGRES_PASSWORD: billing_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U billing -d tuition_billing_tests"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Восстановить пакеты
        run: dotnet restore

      - name: Собрать
        run: dotnet build --no-restore -c Release --warnaserror

      - name: Юнит-тесты доменной логики
        run: dotnet test tests/TuitionBilling.Domain.UnitTests -c Release --no-build --logger "console;verbosity=normal"

      - name: Интеграционные тесты и проверки безопасности
        env:
          TEST_DB_CONNECTION: Host=localhost;Port=5432;Database=tuition_billing_tests;Username=billing;Password=billing_ci
        run: dotnet test tests/TuitionBilling.Api.IntegrationTests -c Release --no-build --logger "console;verbosity=normal"
